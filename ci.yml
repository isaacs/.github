name: CI

on:
  push:
    branches: ["main"]
  pull_request_target:
    paths:
      - 'src/**'
      - 'test/**'
      - '*.json'
      - '*.js'
      - '*.ts'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        node-version: [${NODE_VERSION}]
        platform:
        - os: ubuntu-latest
          shell: bash
        - os: macos-latest
          shell: bash
        - os: windows-latest
          shell: bash
        - os: windows-latest
          shell: powershell
      fail-fast: false

    runs-on: ${{ matrix.platform.os }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    steps:
      - name: Checkout Repository
        uses: ${ACTION_CHECKOUT}

      - name: Use Nodejs ${{ matrix.node-version }}
        uses: ${ACTION_SETUP_NODE}
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- -c -t0
